<style>
:root{padding-block:env(safe-area-inset-top,0px) env(safe-area-inset-bottom,0px)}
body{margin:0}
/* Layout : bandeau de navigation, puis 5 colonnes jour (empilées sur téléphone) */
:root{
  --bg:#f6f7f4; --surface:#ffffff; --fg:#1d2321; --muted:#5d6763; --line:#dde2de;
  --lun:#2f6fb7; --mar:#2e8a57; --mer:#c98a12; --jeu:#7a4fb5; --ven:#c4415f;
  --lun-bg:#e6eef8; --mar-bg:#e4f2ea; --mer-bg:#fbf1dc; --jeu-bg:#efe8f8; --ven-bg:#f9e5ea;
  --c6A:#0e7c86; --c6B:#14a3a0; --c6C:#5cc2b3;
  --c5B:#b5446e; --c5C:#e07a5f;
  --hg:#1f3a5f; --hg-fg:#ffffff; --emc:#f2c14e; --emc-fg:#3a2a00;
  --eval:#c62828;
  --display:"Fraunces",Georgia,serif; --body:"Atkinson Hyperlegible",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141917; --surface:#1d2421; --fg:#eef2ef; --muted:#a4afaa; --line:#2f3934;
  --lun:#7fb0ec; --mar:#6fd09a; --mer:#f0be5a; --jeu:#b99bea; --ven:#f08aa3;
  --lun-bg:#1c2a3b; --mar-bg:#1a2e23; --mer-bg:#33290f; --jeu-bg:#2a2139; --ven-bg:#371d25;
  --c6A:#2bb3bd; --c6B:#4fd1cc; --c6C:#8fe0d2; --c5B:#e07aa1; --c5C:#f2a088;
  --hg:#9cc3f2; --hg-fg:#0f1d2e; --emc:#f2c14e; --emc-fg:#2a1e00; --eval:#ff7b7b;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141917; --surface:#1d2421; --fg:#eef2ef; --muted:#a4afaa; --line:#2f3934;
  --lun:#7fb0ec; --mar:#6fd09a; --mer:#f0be5a; --jeu:#b99bea; --ven:#f08aa3;
  --lun-bg:#1c2a3b; --mar-bg:#1a2e23; --mer-bg:#33290f; --jeu-bg:#2a2139; --ven-bg:#371d25;
  --c6A:#2bb3bd; --c6B:#4fd1cc; --c6C:#8fe0d2; --c5B:#e07aa1; --c5C:#f2a088;
  --hg:#9cc3f2; --hg-fg:#0f1d2e; --emc:#f2c14e; --emc-fg:#2a1e00; --eval:#ff7b7b;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.4;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 40px}
.wrap{max-width:1200px;margin:0 auto;display:grid;gap:16px}
header{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:12px}
h1{font-family:var(--display);font-size:clamp(1.5rem,4vw,2.1rem);margin:0;text-wrap:balance}
.range{color:var(--muted);font-variant-numeric:tabular-nums}
.nav{display:flex;gap:8px;flex-wrap:wrap}
.nav button{font-size:1.5rem;line-height:1;padding:8px 14px}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:8px 14px}
button:hover{border-color:var(--muted)}
button:focus-visible{outline:3px solid var(--lun);outline-offset:2px}
.week{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
@media (max-width:820px){.week{grid-template-columns:1fr}}
.day{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.dhead{background:var(--dbg);border-bottom:4px solid var(--dc);padding:10px 12px;display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.dname{font-family:var(--display);font-size:1.2rem;color:var(--dc);font-weight:700}
.ddate{font-size:1.5rem;font-weight:700;font-variant-numeric:tabular-nums;color:var(--fg)}
.day.today{outline:3px solid var(--dc);outline-offset:-1px}
.today .dname::after{content:" · aujourd'hui";font-family:var(--body);font-size:.8rem;font-weight:400}
.list{display:grid;gap:8px;padding:10px}
.empty{color:var(--muted);font-style:italic;padding:6px 2px}
.s{border:1px solid var(--line);border-left:8px solid var(--cc);border-radius:8px;padding:8px 10px;display:grid;gap:4px;background:var(--surface)}
.s.past{opacity:.5}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.time{font-weight:700;font-variant-numeric:tabular-nums;font-size:1.05rem}
.cls{font-family:var(--display);font-weight:700;font-size:1.35rem;color:var(--cc);line-height:1}
.badge{font-size:.8rem;font-weight:700;padding:2px 8px;border-radius:5px;letter-spacing:.04em}
.badge.HG{background:var(--hg);color:var(--hg-fg)}
.badge.EMC{background:var(--emc);color:var(--emc-fg)}
.room{font-size:.95rem;color:var(--muted)}
.room b{color:var(--fg);font-variant-numeric:tabular-nums}
.eval{font-size:1.2rem;line-height:1}
.who{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.holiday{grid-column:1/-1;background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:28px;text-align:center;color:var(--muted)}
.legend{font-size:.85rem;color:var(--muted)}
.lvl{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.view-cls{display:grid;gap:14px}
.chead{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:6px solid var(--cc);padding-bottom:10px}
.cname{font-family:var(--display);font-size:clamp(2.4rem,9vw,3.4rem);font-weight:700;color:var(--cc);line-height:1}
.csub{color:var(--muted)}
.clist{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.cs{background:var(--surface);border:1px solid var(--line);border-left:8px solid var(--dc);border-radius:8px;padding:10px 12px;display:grid;gap:6px}
.cs .dlabel{font-weight:700;color:var(--dc);font-size:1.05rem}
.cs .dlabel b{color:var(--fg);font-variant-numeric:tabular-nums}
.cs.next{outline:3px solid var(--cc);outline-offset:-1px}
.cs .tag{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--cc);font-weight:700}
.dots{display:flex;justify-content:center;gap:8px;align-items:center}
.dot{width:10px;height:10px;border-radius:50%;background:var(--line);border:0;padding:0}
.dot.on{background:var(--dc,var(--fg));transform:scale(1.4)}
.swipe-hint{text-align:center;color:var(--muted);font-size:.85rem}
.slide-l{animation:sl .22s ease-out}.slide-r{animation:sr .22s ease-out}
@keyframes sl{from{transform:translateX(40px);opacity:.3}to{transform:none;opacity:1}}
@keyframes sr{from{transform:translateX(-40px);opacity:.3}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.slide-l,.slide-r{animation:none}}
body{touch-action:pan-y}
[hidden]{display:none!important}
html,body{overscroll-behavior-y:none}
.s,.cs{cursor:pointer;transition:transform .1s}
.s:active,.cs:active{transform:scale(.98)}
.s:focus-visible,.cs:focus-visible{outline:3px solid var(--cc);outline-offset:2px}
.detail{display:grid;gap:16px}
.dtop{display:flex;align-items:center;gap:12px;flex-wrap:wrap;border-bottom:6px solid var(--cc);padding-bottom:12px}
.back{font-size:1.6rem;line-height:1;padding:6px 14px}
.dcls{font-family:var(--display);font-size:clamp(2.2rem,8vw,3rem);font-weight:700;color:var(--cc);line-height:1}
.dtop .badge{font-size:1rem;padding:4px 10px}
.dtop .eval{font-size:1.6rem}
.dmeta{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:1.05rem}
.dmeta b{font-variant-numeric:tabular-nums}
.dmeta .dday{color:var(--dc);font-weight:700}
.disc{font-size:.8rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:700}
.dtitle{font-family:var(--display);font-size:clamp(1.4rem,5vw,1.9rem);line-height:1.2;margin:0;text-wrap:balance;max-width:40ch}
.dparts{display:grid;gap:8px;margin:0;padding:0;list-style:none;max-width:65ch}
.dparts li{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:1.05rem}
.dparts li.cahier{border-left:6px solid var(--emc)}
.dparts li.note{border-left:6px solid var(--eval)}
.intbox{border:2px dashed var(--eval);border-radius:10px;padding:10px 12px;max-width:65ch}
.intbox b{color:var(--eval)}
.evtxt{font-size:.8rem;font-weight:700;color:var(--eval);margin-left:3px;vertical-align:middle}
.set{display:grid;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;max-width:640px}
.set h3{margin:0;font-family:var(--display);font-size:1.15rem}
.hint{margin:0;color:var(--muted);font-size:.95rem}
.steps{padding-left:1.2em;display:grid;gap:4px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-block;font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:10px 14px;font-weight:700}
.btn.primary{background:var(--lun);color:var(--surface);border-color:transparent}
.msg{margin:0;font-weight:700}.msg.ok{color:var(--mar)}.msg.err{color:var(--eval)}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.fields label{display:grid;gap:4px;font-size:.85rem;color:var(--muted)}
.fields input{min-width:0;width:100%;box-sizing:border-box;font:inherit;font-size:1.1rem;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg)}
.quick{display:flex;gap:6px;flex-wrap:wrap}
.quick button{font-size:1.2rem;padding:6px 10px}
.filt{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.filt label{display:grid;gap:4px;font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;min-width:0}
.filt .wide{grid-column:1/-1}
.filt select,.filt input{font:inherit;font-size:1.05rem;text-transform:none;letter-spacing:0;font-weight:400;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;min-width:0;width:100%;box-sizing:border-box}
.filt .btn{grid-column:1/-1;justify-self:start}
.count{margin:0;font-weight:700;color:var(--muted)}
.cs.past{opacity:.55}
.ctxt{font-size:.95rem;color:var(--muted);line-height:1.35}
.dot.sq{border-radius:2px}
.dot.sq.on{background:var(--lun)}
</style>
</head>

      const st=+m[1]*60+ +m[2];

    ${c.int?`<div class="intbox"><b>Interrogation de 5 min /10</b> en début d’heure (filet de note du T${c.int}, avant le conseil ; remplace le rituel des 3 questions ce jour-là).</div>`:""}`;
  document.getElementById("back").onclick=()=>history.back();
  if(!inDetail){history.pushState({detail:1},"");inDetail=true}
  mainView.style.display="none";clsView.hidden=true;srchView.hidden=true;dotsEl.style.visibility="hidden";hintEl.hidden=true;detailEl.hidden=false;
  window.scrollTo(0,0);document.getElementById("back").focus({preventScroll:true});
}
function closeDetail(){if(!inDetail)return;inDetail=false;render();detailEl.hidden=true;dotsEl.style.visibility="";hintEl.hidden=false;
  showViews();if(lastFocus)lastFocus.focus({preventScroll:true})}
window.addEventListener("popstate",closeDetail);

/* ---- Paramètres ---- */

  detailEl.style.setProperty("--cc","var(--fg)");
  const info=SOURCE?`Fichier « ${esc(SOURCE.name)} » importé le ${esc(SOURCE.when)} : ${SOURCE.n} séances, du ${esc(SOURCE.from)} au ${esc(SOURCE.to)}.`:"Version intégrée à l’application (412 séances, 2026-2027).";
  detailEl.innerHTML=`<div class="dtop"><button type="button" class="back" id="back" aria-label="Retour">←</button><span class="dcls">Paramètres</span></div>
  <section class="set"><h3>Fichier des séances</h3>
    <p class="hint">${info}</p>
    <ol class="hint steps"><li>Dans Drive, ouvre le nouveau fichier puis <i>Fichier → Télécharger → Microsoft Excel (.xlsx)</i>.</li>
      <li>Touche « Importer un fichier » et choisis-le dans tes téléchargements.</li></ol>
    <p class="hint">L’application lit l’onglet « Séances » (colonnes Date, Créneau, Séance, Classe, Salle, Éval., Contenu).</p>
    <div class="btns"><label class="btn primary" for="file">Importer un fichier</label>
      <input type="file" id="file" accept=".xlsx,.xls,.ods,.csv" hidden>
      ${SOURCE?'<button type="button" class="btn" id="reset">Revenir à la version intégrée</button>':""}</div>
    <p class="msg" id="msg" role="status"></p></section>
  <section class="set"><h3>Évaluations notées (★ dans le fichier)</h3>
    <div class="fields"><label>Symbole<input id="evSym" maxlength="8" value="${esc(CFG.evSym)}"></label>
      <label>Texte (facultatif)<input id="evTxt" maxlength="24" value="${esc(CFG.evTxt)}" placeholder="ex. Éval"></label></div>
    <div class="quick" data-target="evSym">${["☢️","⭐","🔴","📝","❗","🎯"].map(e=>`<button type="button">${e}</button>`).join("")}</div></section>
  <section class="set"><h3>Interrogations de 5 min (INT)</h3>
    <div class="fields"><label>Symbole<input id="intSym" maxlength="8" value="${esc(CFG.intSym)}" placeholder="aucun"></label>
      <label>Texte (facultatif)<input id="intTxt" maxlength="24" value="${esc(CFG.intTxt)}" placeholder="ex. INT"></label></div>
    <div class="quick" data-target="intSym">${["⏱️","✏️","🟡","❓"].map(e=>`<button type="button">${e}</button>`).join("")}<button type="button" data-v="">aucun</button></div></section>
  <section class="set"><h3>Aperçu</h3><div class="s" id="prev-card" style="--cc:var(--c6A);cursor:default"></div></section>`;
  const pv=()=>{document.getElementById("prev-card").innerHTML=`<div class="row"><span class="time">10h00 – 10h55</span><span class="room">Salle <b>214</b></span></div>
    <div class="row"><span class="who"><span class="cls">6A</span><span class="badge HG">HG 19</span>${mark({ev:1})}</span><span class="who"><span class="badge EMC">EMC 05</span>${mark({int:1})}</span></div>`};
  ["evSym","evTxt","intSym","intTxt"].forEach(id=>{const i=document.getElementById(id);i.addEventListener("input",()=>{CFG[id]=i.value.trim();saveCfg();pv()})});
  detailEl.querySelectorAll(".quick").forEach(q=>q.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;
    const id=q.dataset.target,v=b.dataset.v!=null?b.dataset.v:b.textContent;document.getElementById(id).value=v;CFG[id]=v;saveCfg();pv()}));
  document.getElementById("file").addEventListener("change",e=>{const f=e.target.files[0];if(f)importFile(f);e.target.value=""});
  const r=document.getElementById("reset");if(r)r.onclick=()=>{try{localStorage.removeItem(LS+"donnees")}catch(e){}SOURCE=null;setData(builtin());openSettings();say("Version intégrée rétablie.",true)};
  pv();
  document.getElementById("back").onclick=()=>history.back();
  if(!inDetail){history.pushState({detail:1},"");inDetail=true}

function say(t,ok){const m=document.getElementById("msg");if(m){m.textContent=t;m.className="msg "+(ok?"ok":"err")}}
document.getElementById("gear").onclick=()=>{lastFocus=document.getElementById("gear");openSettings()};

/* ---- Import du fichier (.xlsx) ---- */
function loadXLSX(){return window.XLSX?Promise.resolve():new Promise((ok,ko)=>{const sc=document.createElement("script");sc.src="xlsx.full.min.js";sc.onload=ok;sc.onerror=()=>ko(new Error("Lecteur de fichiers indisponible (connexion ?)"));document.head.appendChild(sc)})}
const norm=t=>String(t??"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z]/g,"");
function schoolYear(){const t=new Date();return t.getMonth()>=7?t.getFullYear():t.getFullYear()-1}
function parseDate(v,y0){
  if(typeof v==="number"&&v>20000){const d=new Date(Date.UTC(1899,11,30)+Math.round(v)*864e5);return d.getUTCFullYear()+"-"+pad(d.getUTCMonth()+1)+"-"+pad(d.getUTCDate())}
  if(v instanceof Date)return v.getFullYear()+"-"+pad(v.getMonth()+1)+"-"+pad(v.getDate());
  const m=String(v??"").match(/(\d{1,2})[\/.-](\d{1,2})(?:[\/.-](\d{2,4}))?/);if(!m)return null;
  const dd=+m[1],mm=+m[2];let y=m[3]?+m[3]:(mm>=8?y0:y0+1);if(y<100)y+=2000;
  if(mm<1||mm>12||dd<1||dd>31)return null;return y+"-"+pad(mm)+"-"+pad(dd)}
function parseRows(rows){
  const y0=schoolYear();let hi=-1,col={};
  for(let i=0;i<Math.min(rows.length,30);i++){const r=(rows[i]||[]).map(norm);
    if(r.includes("date")&&r.includes("classe")&&r.some(c=>c.startsWith("seance"))){hi=i;
      r.forEach((c,j)=>{if(c==="date")col.date=j;else if(c.startsWith("creneau"))col.cr=j;else if(c==="seance")col.se=j;else if(c==="classe")col.cl=j;
        else if(c==="salle")col.sa=j;else if(c.startsWith("eval"))col.ev=j;else if(c==="contenu")col.co=j});break}}
  if(hi<0||col.date==null||col.se==null||col.cl==null||col.cr==null)throw new Error("Onglet « Séances » introuvable ou colonnes manquantes (Date, Créneau, Séance, Classe).");
  const out=[];let skipped=0;
  for(let i=hi+1;i<rows.length;i++){const r=rows[i]||[];if(!r.length||r.every(c=>c==null||c===""))continue;
    const k=parseDate(r[col.date],y0),se=String(r[col.se]??"").match(/^\s*(HG|EMC)\s*0*(\d+)/i),cr=String(r[col.cr]??"").match(/(\d{1,2})\s*[hH:]\s*(\d{2})(?:\s*[-–à]+\s*(\d{1,2})\s*[hH:]\s*(\d{2}))?/),cl=String(r[col.cl]??"").trim().toUpperCase();
    if(!k||!se||!cr||!cl){skipped++;continue}
    const st=+cr[1]*60+ +cr[2],en=cr[3]?+cr[3]*60+ +cr[4]:st+55,ev=String(col.ev!=null?r[col.ev]??"":"");
    out.push({k,h:+cr[1],m:+cr[2],start:hm(st),end:hm(en),mat:se[1].toUpperCase(),num:pad(+se[2]),cls:cl,room:String(col.sa!=null?r[col.sa]??"":"").trim()||"?",
      ev:/★|\*/.test(ev),int:/INT/i.test(ev),txt:col.co!=null?String(r[col.co]??"").trim():""});}
  return {out,skipped};
}
async function importFile(f){
  say("Lecture du fichier…",true);
  try{await loadXLSX();
    const wb=XLSX.read(await f.arrayBuffer(),{type:"array"});
    const names=wb.SheetNames;const pick=names.find(n=>norm(n)==="seances");
    const order=pick?[pick,...names.filter(n=>n!==pick)]:names;let res=null,err=null;
    for(const n of order){try{res=parseRows(XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:true,defval:null}));if(res.out.length)break}catch(e){err=e;res=null}}
    if(!res||!res.out.length)throw err||new Error("Aucune séance trouvée dans ce fichier.");
    const list=res.out.sort((a,b)=>a.k<b.k?-1:a.k>b.k?1:a.h*60+a.m-(b.h*60+b.m));
    const fd=k=>k.split("-").reverse().join("/");const now=new Date();
    const meta={name:f.name,when:pad(now.getDate())+"/"+pad(now.getMonth()+1)+"/"+now.getFullYear()+" à "+pad(now.getHours())+"h"+pad(now.getMinutes()),
      n:list.length,from:fd(list[0].k),to:fd(list[list.length-1].k)};
    try{localStorage.setItem(LS+"donnees",JSON.stringify({meta,list}))}catch(e){throw new Error("Impossible d’enregistrer les données sur cet appareil.")}
    SOURCE=meta;setData(list);openSettings();
    say(`✔ ${list.length} séances importées (du ${meta.from} au ${meta.to})${res.skipped?" · "+res.skipped+" ligne(s) ignorée(s)":""}.`,true);
  }catch(e){say("✘ "+e.message+" Les données actuelles sont conservées.",false)}
}

/* ---- Actualisation automatique (changement d'heure ou de jour) ---- */
function refreshNow(){
  const wasHome=key(base)===key(home);today=new Date();home=homeWeek(today);
  if(wasHome)base=new Date(home);
  render();if(view>=0&&!inDetail)renderPage();
}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")refreshNow()});
window.addEventListener("focus",refreshNow);window.addEventListener("pageshow",refreshNow);
setInterval(refreshNow,60000);
if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(()=>{})}
