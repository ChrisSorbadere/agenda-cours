.list{display:grid;gap:8px;padding:10px}
.empty{color:var(--muted);font-style:italic;padding:6px 2px}

  if(CLASSES.includes(c))b.style.setProperty("--cc","var(--c"+c+")");
  b.setAttribute("aria-pressed",state.on.has(c));
  b.onclick=()=>{state.on.has(c)?state.on.delete(c):state.on.add(c);b.setAttribute("aria-pressed",state.on.has(c));
    try{localStorage.setItem("filtres",JSON.stringify([...state.on]))}catch(e){};render()};
  filters.appendChild(b);
});

function monday(d){const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());const w=(x.getDay()+6)%7;x.setDate(x.getDate()-w);return x}
const today=new Date();
let base=monday(today); if(today.getDay()===0||today.getDay()===6) base.setDate(base.getDate()+7);
const home=new Date(base);

function render(){
  const week=document.getElementById("week");week.innerHTML="";
  const end=new Date(base);end.setDate(end.getDate()+4);
  document.getElementById("range").textContent="Du "+pad(base.getDate())+"/"+pad(base.getMonth()+1)+" au "+pad(end.getDate())+"/"+pad(end.getMonth()+1)+"/"+end.getFullYear();
  const isHome=key(base)===key(home);
  document.getElementById("title").textContent=isHome?"Ma semaine":"Semaine du "+pad(base.getDate())+"/"+pad(base.getMonth()+1);
  let total=0;
  DAYS.forEach(([name,c],i)=>{
    const d=new Date(base);d.setDate(d.getDate()+i);const list=byDay[key(d)]||[];total+=list.length;
    const col=document.createElement("section");col.className="day"+(key(d)===key(today)?" today":"");
    col.style.setProperty("--dc","var(--"+c+")");col.style.setProperty("--dbg","var(--"+c+"-bg)");
    col.innerHTML=`<div class="dhead"><span class="dname">${name}</span><span class="ddate">${pad(d.getDate())}/${pad(d.getMonth()+1)}</span></div>`;
    const ul=document.createElement("div");ul.className="list";
    const shown=list.filter(s=>state.on.has(s.cls)&&state.on.has(s.mat));
    if(!shown.length) ul.innerHTML=`<div class="empty">${list.length?"Rien avec ces filtres":"Pas de cours"}</div>`;
    shown.forEach(s=>{
      const past=new Date(d.getFullYear(),d.getMonth(),d.getDate(),s.h,s.m+55)<today;
      const el=document.createElement("div");el.className="s"+(past?" past":"");el.style.setProperty("--cc","var(--c"+s.cls+")");
      el.innerHTML=`<div class="row"><span class="time">${s.start} – ${s.end}</span><span class="room">Salle <b>${s.room}</b></span></div>
        <div class="row"><span class="who"><span class="cls">${s.cls}</span><span class="badge ${s.mat}">${s.mat} ${s.num}</span>${s.ev?'<span class="eval" title="Évaluation notée" aria-label="Évaluation notée">☢️</span>':""}</span></div>`;
      ul.appendChild(el);
    });
    col.appendChild(ul);week.appendChild(col);
  });
  if(!total){const h=document.createElement("div");h.className="holiday";h.textContent="Aucune séance cette semaine (vacances ou hors année scolaire).";week.prepend(h)}
}
document.getElementById("prev").onclick=()=>{base.setDate(base.getDate()-7);render()};
document.getElementById("next").onclick=()=>{base.setDate(base.getDate()+7);render()};
document.getElementById("now").onclick=()=>{base=new Date(home);render()};
render();
if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(()=>{})}
</script>
</body>
</html>
